# Toolchain-free checks: these steps need only a Python interpreter, so they
# run on every push and pull request without the pinned Elisa compiler,
# prover, ElisaScript launcher, or a graphics session. The full gate stays
# local (`elisascript scripts/check.elisascript`) because it needs all four.
name: cook

on:
  push:
  pull_request:

jobs:
  cook:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Python 3.14 provides compression.zstd for ELPK bundles on runners
      # where libzstd is not on the loader path.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path("scripts").glob("*.py")) + [Path("test/check_workflow.py")]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"compiled {len(files)} Python files")
          PY
      - name: Elisa source-length policy
        run: python scripts/check_source_length.py
      - name: Elisa module hygiene policy
        run: python scripts/check_module_hygiene.py
      - name: Bounded import self-test
        run: python scripts/cook_assets.py --self-test
      - name: Cook assets and verify the KTX containers
        run: |
          python scripts/cook_assets.py "$PWD"
          python - <<'PY'
          from pathlib import Path

          identifier = bytes((0xAB, 0x4B, 0x54, 0x58, 0x20, 0x31, 0x31, 0xBB, 0x0D, 0x0A, 0x1A, 0x0A))
          cooked = Path("build/cooked")
          for name in ("maze_tile_tex.ktx", "maze_tile_tex_bc1.ktx"):
              data = (cooked / name).read_bytes()
              assert data.startswith(identifier), f"{name} has no KTX identifier"
              assert data[12:16] == b"\x01\x02\x03\x04", f"{name} is not little-endian KTX"
          assert (Path("build/catalogue.db")).is_file(), "cook produced no catalogue"
          print("cooked KTX containers and catalogue verified")
          PY

  # The real libraries that need a toolchain: the selected transport and the
  # Basis encoder are fetched, built, and run, and the boundary libraries run
  # under AddressSanitizer/UBSan. These mirror commands verified on the
  # development machine; the pinned compiler/prover and the graphics hosts
  # still need the full local gate.
  native:
    runs-on: macos-latest
    env:
      HOMEBREW_PREFIX: /opt/homebrew
      HOMEBREW_INCLUDE_DIR: /opt/homebrew/include
      HOMEBREW_LIBRARY_DIR: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install protobuf openssl@3 freetype harfbuzz zstd
      - name: GameNetworkingSockets transport
        run: python3 scripts/gns_probe.py
      - name: Basis Universal KTX2
        run: python3 scripts/basisu_probe.py
      - name: Fetch boundary dependencies
        run: |
          python3 scripts/fetch_ozz.py
          python3 scripts/fetch_recast.py
      - name: Boundary sanitizers (ASan + UBSan)
        run: python3 scripts/run_boundary_sanitized.py
