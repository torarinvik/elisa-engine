# Toolchain-free checks need only Python, so they run across hosts. The pinned
# Elisa compiler/prover/ElisaScript build remains deferred until the pinned
# proof/compiler/runtime tuple passes strict qualification; interactive graphics
# validation remains local.
name: cook

on:
  push:
  pull_request:

jobs:
  cook:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Python 3.14 provides compression.zstd for ELPK bundles on runners
      # where libzstd is not on the loader path.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python syntax
        run: |
          python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" python-syntax -- python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path("scripts").glob("*.py")) + [Path("test/check_workflow.py")]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"compiled {len(files)} Python files")
          PY
      - name: Elisa source-length policy
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" source-length -- python scripts/check_source_length.py
      - name: Elisa module hygiene policy
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" module-hygiene -- python scripts/check_module_hygiene.py
      - name: Bounded import self-test
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" import-self-test -- python scripts/cook_assets.py --self-test
      - name: CI stage recorder self-test
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" ci-stage-test -- python scripts/test_ci_stage.py
      - name: Global grant and hosted toolchain policy controls
        run: |
          python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" grant-policy -- python scripts/test_qualify_global_grants.py
          python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" toolchain-policy -- python scripts/test_provision_hosted_toolchain.py
      - name: Hosted toolchain plan (build deferred until proof qualification)
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" toolchain-plan -- python scripts/provision_hosted_toolchain.py --plan
      - name: Verify recorded toolchain upstream heads
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" toolchain-upstream -- python scripts/provision_hosted_toolchain.py --plan --verify-upstream
      - name: Native smoke artifact self-test
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" smoke-artifacts -- python scripts/native_smoke_artifacts.py --self-test
      - name: Course sounds match their generator
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" course-sounds -- python examples/character_course/make_sounds.py --check
      - name: Course rig matches its generator
        run: python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" course-rigs -- python examples/character_course/make_rigs.py --check
      - name: Cook assets and verify the KTX containers
        run: |
          python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" cook -- python scripts/cook_assets.py "$PWD"
          python scripts/ci_stage.py build/ci "cook-${{ matrix.os }}" ktx-verify -- python - <<'PY'
          from pathlib import Path

          identifier = bytes((0xAB, 0x4B, 0x54, 0x58, 0x20, 0x31, 0x31, 0xBB, 0x0D, 0x0A, 0x1A, 0x0A))
          cooked = Path("build/cooked")
          for name in ("maze_tile_tex.ktx", "maze_tile_tex_bc1.ktx"):
              data = (cooked / name).read_bytes()
              assert data.startswith(identifier), f"{name} has no KTX identifier"
              assert data[12:16] == b"\x01\x02\x03\x04", f"{name} is not little-endian KTX"
          assert (Path("build/catalogue.db")).is_file(), "cook produced no catalogue"
          print("cooked KTX containers and catalogue verified")
          PY
      - name: Retain portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-portable-cook-${{ matrix.os }}
          path: |
            build/ci/
            build/catalogue.db
          if-no-files-found: warn
          retention-days: 30

  # The real libraries that need a toolchain: the selected transport and the
  # Basis encoder are fetched, built, and run, and the boundary libraries run
  # under AddressSanitizer/UBSan. Elisa tool builds are intentionally deferred
  # until the pinned proof/compiler/runtime tuple passes strict qualification.
  native:
    runs-on: macos-latest
    env:
      HOMEBREW_PREFIX: /opt/homebrew
      HOMEBREW_INCLUDE_DIR: /opt/homebrew/include
      HOMEBREW_LIBRARY_DIR: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install protobuf openssl@3 freetype harfbuzz zstd
      # Keep this cache scoped to the hosted macOS toolchain and the exact
      # dependency/build inputs. The fingerprint hashes the installed ABI
      # package versions plus the compiler and CMake versions.
      - name: Native dependency cache fingerprint
        id: native-cache
        run: |
          set -euo pipefail
          brew list --versions protobuf openssl@3 freetype harfbuzz zstd > /tmp/native-brew-versions
          {
            clang++ --version | head -n 1
            cmake --version | head -n 1
            sw_vers --productVersion
            xcrun --sdk macosx --show-sdk-version
            xcodebuild -version | head -n 2
            cat /tmp/native-brew-versions
            printf '%s\n' \
              'CMAKE_BUILD_TYPE=Release' \
              'GNS:BUILD_SHARED_LIB=OFF,BUILD_STATIC_LIB=ON,USE_STEAM_SOCKETS=OFF' \
              'Basis:target=basisu' \
              'ozz:tools/samples/howtos/tests=OFF;targets=ozz_animation,ozz_animation_offline' \
              'Recast:POLICY=3.5,DEMO/TESTS/EXAMPLES=OFF;targets=Recast,Detour'
          } > /tmp/native-cache-inputs
          echo "toolchain=$(shasum -a 256 /tmp/native-cache-inputs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # No broad restore key: only an exact platform/toolchain/source match
      # can reuse compiled outputs. Native inputs stay separate from build/ci.
      - name: Restore native dependency cache
        id: native-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            dependencies/gns
            dependencies/basisu
            dependencies/ozz
            dependencies/recast
          key: native-${{ runner.os }}-${{ runner.arch }}-gns-a424b7db649438acafb60c99cae6667587c42732-basis-99f52d63aa6799cbdaecfe977111dc5ec3b31d47-ozz-6cbdc790123aa4731d82e255df187b3a8a808256-recast-6dc1667f580357e8a2154c28b7867bea7e8ad3a7-clang-cmake-${{ steps.native-cache.outputs.toolchain }}-${{ hashFiles('scripts/fetch_gns.py', 'scripts/fetch_basisu.py', 'scripts/fetch_ozz.py', 'scripts/fetch_recast.py') }}
      - name: Validate restored native dependencies
        if: steps.native-deps.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          dependencies = Path("dependencies")
          specs = {
              "gns": ("a424b7db649438acafb60c99cae6667587c42732", ("build/src/libGameNetworkingSockets_s.a",)),
              "basisu": ("99f52d63aa6799cbdaecfe977111dc5ec3b31d47", ("bin/basisu",)),
              "ozz": ("6cbdc790123aa4731d82e255df187b3a8a808256", (
                  "build/src/base/libozz_base_r.a",
                  "build/src/animation/runtime/libozz_animation_r.a",
                  "build/src/animation/offline/libozz_animation_offline_r.a",
              )),
              "recast": ("6dc1667f580357e8a2154c28b7867bea7e8ad3a7", (
                  "build/Recast/libRecast.a", "build/Detour/libDetour.a",
              )),
          }
          for name, (revision, outputs) in specs.items():
              checkout = dependencies / name
              try:
                  head = subprocess.check_output(
                      ["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
                  valid = head == revision and all((checkout / output).is_file() for output in outputs)
              except (OSError, subprocess.CalledProcessError):
                  valid = False
              if not valid:
                  print(f"Discarding incomplete or stale {name} cache; fetch step will rebuild it")
                  shutil.rmtree(checkout, ignore_errors=True)
              else:
                  print(f"Validated {name} at {revision}")
          PY
      - name: GameNetworkingSockets transport
        run: python3 scripts/ci_stage.py build/ci native gns-probe -- python3 scripts/gns_probe.py
      - name: Basis Universal KTX2
        run: python3 scripts/ci_stage.py build/ci native basisu-probe -- python3 scripts/basisu_probe.py
      - name: Fetch boundary dependencies
        run: |
          python3 scripts/ci_stage.py build/ci native fetch-ozz -- python3 scripts/fetch_ozz.py
          python3 scripts/ci_stage.py build/ci native fetch-recast -- python3 scripts/fetch_recast.py
      - name: Crash reports (forked SIGSEGV/SIGABRT children)
        run: python3 scripts/ci_stage.py build/ci native crash-report -- python3 scripts/test_crash_report.py
      - name: Process-group time and RSS budget controls
        run: python3 scripts/test_run_process_budget.py
      - name: Boundary sanitizers (ASan + UBSan)
        run: python3 scripts/ci_stage.py build/ci native boundary-sanitizers -- python3 scripts/run_boundary_sanitized.py
      - name: Save validated native dependency cache
        if: success() && steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dependencies/gns
            dependencies/basisu
            dependencies/ozz
            dependencies/recast
          key: native-${{ runner.os }}-${{ runner.arch }}-gns-a424b7db649438acafb60c99cae6667587c42732-basis-99f52d63aa6799cbdaecfe977111dc5ec3b31d47-ozz-6cbdc790123aa4731d82e255df187b3a8a808256-recast-6dc1667f580357e8a2154c28b7867bea7e8ad3a7-clang-cmake-${{ steps.native-cache.outputs.toolchain }}-${{ hashFiles('scripts/fetch_gns.py', 'scripts/fetch_basisu.py', 'scripts/fetch_ozz.py', 'scripts/fetch_recast.py') }}
      # Hosted runners have no GPU session: this artifact is headless evidence
      # only (`hardware_verification: unverified`). GPU workstation evidence is
      # `build/native-gate.json` from `native_gate.elisascript native`.
      - name: Retain headless evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-headless-native
          path: build/ci/
          if-no-files-found: warn
          retention-days: 30
